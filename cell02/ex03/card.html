<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <table class="profile-card">

        <tr>
            <th class="card-header">
                <h2>My Profile</h2>
            </th>
        </tr>

        <tr>
            <td class="card-image">
                <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?q=80&w=200&auto=format&fit=crop" alt="Profile Picture" class="profile-pic">
            </td>
        </tr>

        <tr>
            <td class="card-login">
                <h3>student_42</h3>
            </td>
        </tr>

        <tr>
            <td class="card-desc">
                Code, Coffee, Sleep.
            </td>
        </tr>

        <!-- 5. ไอคอน Social Networks -->
        <tr>
            <td class="card-socials">
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub"></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn"></a>
                <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/124/124021.png" alt="Twitter"></a>
            </td>
        </tr>

        <!-- 6. ปุ่ม Contact ด้านล่างสุด -->
        <tr>
            <td class="card-button">
                <button class="contact-btn">Contact</button>
            </td>
        </tr>

    </table>

</body>
</html>

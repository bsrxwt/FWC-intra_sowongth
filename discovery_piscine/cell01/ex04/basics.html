<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basics</title>
    <style>
        body {
            background-color: pink;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: white;
            text-align: center;
            font-size: 40px;
        }
        .shops {
            display: flex;
            justify-content: center;
            gap: 40px;
        }
        .shop {
            text-align: center;
        }
        .shop img {
            width: 250px;
            height: 180px;
            object-fit: contain;
            background-color: white;
        }
        footer {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Basics &amp; Online Shops!</h1>
    <div class="shops">
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Amazon_logo.svg" alt="Amazon logo">
            <br>
            <a href="https://www.amazon.com">Visit Amazon</a>
        </div>
        <div class="shop">
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Etsy_logo.svg" alt="Etsy logo">
            <br>
            <a href="https://www.etsy.com">Visit Etsy</a>
        </div>
    </div>
    <hr>
    <footer>&copy; wil 2026</footer>
</body>
</html>

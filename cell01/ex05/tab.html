<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            height: 100px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: lightblue;">Blue sky</td>
            <td style="background-color: lightgreen;">Green grass</td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
        }
        table {
            width: 100vw;
            height: 100vh;
            border-collapse: collapse;
        }

        td {
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: lightblue;">Blue sky</td>
            <td style="background-color: lightgreen;">Green grass</td>
        </tr>
    </table>
</body>
</html>
